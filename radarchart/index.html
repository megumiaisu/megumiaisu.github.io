<head>
	<!-- Load plotly.js into the DOM -->
	<script src='https://cdn.plot.ly/plotly-2.35.2.min.js'></script>
</head>

<body style="background-color:#444444; height:400px;margin:0 auto;">
	<div id='myDiv' style="background-color:#444444;width: 100%;"><!-- Plotly chart will be drawn inside this DIV --></div>
  <script>
    data = [{
  type: 'scatterpolar',
  r: [10, 4, 2, 2, 18, 7, 3, 24, 3, 10],
  theta: ['Aviation', 'Cultural Herirage', 'Defense', 'Env. Remediation', 'Fisheries', 'Natural Resources', 'NEPA', 'Oceanography', 'Oil & Gas', 'Aviation'],
  fill: 'toself',
  line: {
    color: '#4bc000'
  },
  hoverlabel: {
    bgcolor: '#E3E3E3',
    font: {
      size: 13
    }
  },
  hovertemplate: 'Project Count for %{theta}: %{r}<extra></extra>'
}]

layout = {
  polar: {
    gridshape: "circular",
    radialaxis: {
      angle: 90,
      visible: true,
      range: [0, 26],
      color: '#fff',
      tickfont: {
        size: 8
      },
      tickangle: 90,
      layer: "below traces"
    },
    bgcolor: '#444444',
    angularaxis: {
      direction: "clockwise",
      griddash: "solid",
      gridcolor: "#8F8F8F"
    }
  },
  font: {
    size: 11,
    family: 'Arial',
    color: '#ffffff'
  },
  paper_bgcolor: '#444444',
  plot_bgcolor: '#444444',
  showlegend: false,
  xaxis: {
    title: '#000'
  }
}

Plotly.newPlot("myDiv", data, layout)

  </script>
</body>
